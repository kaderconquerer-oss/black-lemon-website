<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Lemon — Event Studio · Dubai</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="site.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components/tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/primitives.jsx"></script>
  <script type="text/babel" src="components/chrome.jsx"></script>
  <script type="text/babel" src="components/data.jsx"></script>
  <script type="text/babel" src="pages/home.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "logoTone": "black"
    }/*EDITMODE-END*/;

    function Site() {
      useSmoothScroll();
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // Logo tone options:
      //   "black"  → wordmark-black.png  (white text on black — best on dark bg)
      //   "white"  → wordmark-white.png  (black text on white)
      //   "yellow" → wordmark-yellow.png (yellow accent text)
      return (
        <>
          <CursorBar />
          <ScrollProgress />
          <SiteHeader logoTone={t.logoTone} />
          <main><HomePage /></main>
          <WhatsAppFab />
          <SiteFooter logoTone={t.logoTone} />

          <TweaksPanel title="Tweaks">
            <TweakSection label="Identity">
              <TweakRadio
                label="Logo lockup"
                value={t.logoTone}
                options={[
                  { label: 'White text', value: 'black' },
                  { label: 'Black text', value: 'white' },
                  { label: 'Yellow', value: 'yellow' },
                ]}
                onChange={(v) => setTweak('logoTone', v)}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
  </script>
</body>
</html>
