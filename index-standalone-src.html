<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Lemon — Brand & Website</title>
  <meta name="ext-resource-dependency" content="assets/wordmark-black.png" data-resource-id="wordmark-black" />
  <meta name="ext-resource-dependency" content="assets/wordmark-yellow.png" data-resource-id="wordmark-yellow" />
  <meta name="ext-resource-dependency" content="assets/wordmark-white.png" data-resource-id="wordmark-white" />
  <meta name="ext-resource-dependency" content="assets/full-black.png" data-resource-id="full-black" />
  <meta name="ext-resource-dependency" content="assets/full-yellow.png" data-resource-id="full-yellow" />
  <meta name="ext-resource-dependency" content="assets/full-white.png" data-resource-id="full-white" />
  <template id="__bundler_thumbnail" data-bg-color="#0a0a0a">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" fill="#0a0a0a"/>
      <text x="40" y="100" font-family="sans-serif" font-size="48" font-weight="700" fill="#ffffff">B</text>
      <rect x="78" y="60" width="6" height="60" fill="#fdd535"/>
      <text x="92" y="100" font-family="sans-serif" font-size="48" font-weight="700" fill="#ffffff">L</text>
    </svg>
  </template>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; background: #f0eee9; font-family: 'Manrope', system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components-standalone/primitives.jsx"></script>
  <script type="text/babel" src="components-standalone/brand-guidelines.jsx"></script>
  <script type="text/babel" src="components-standalone/site-a.jsx"></script>
  <script type="text/babel" src="components-standalone/site-b.jsx"></script>
  <script type="text/babel" src="components-standalone/site-c.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "yellow": "#fdd535",
      "theme": "dark",
      "heroVariant": "kinetic"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // Apply yellow CSS variable globally
      React.useEffect(() => {
        document.documentElement.style.setProperty('--bl-yellow', tweaks.yellow);
      }, [tweaks.yellow]);

      return (
        <>
          <DesignCanvas>

            {/* ───── BRAND GUIDELINES ───── */}
            <DCSection id="brand" title="Brand Guidelines" subtitle="Logo, color, type, voice, icons, applications">
              <DCArtboard id="logo" label="01 · Logo System" width={1100} height={1280}>
                <div className="bl-noscroll" style={{ height: '100%' }}>
                  <LogoSystem />
                </div>
              </DCArtboard>
              <DCArtboard id="color" label="02 · Color" width={1100} height={1280}>
                <div className="bl-noscroll" style={{ height: '100%' }}>
                  <ColorSystem />
                </div>
              </DCArtboard>
              <DCArtboard id="type" label="03 · Typography" width={1100} height={1280}>
                <div className="bl-noscroll" style={{ height: '100%' }}>
                  <TypeSystem />
                </div>
              </DCArtboard>
              <DCArtboard id="voice" label="04 · Voice" width={1100} height={1100}>
                <div className="bl-noscroll" style={{ height: '100%' }}>
                  <VoiceSystem />
                </div>
              </DCArtboard>
              <DCArtboard id="icons" label="05 · Icon Set" width={1100} height={1100}>
                <div className="bl-noscroll" style={{ height: '100%' }}>
                  <IconSet />
                </div>
              </DCArtboard>
              <DCArtboard id="applications" label="06 · Applications" width={1100} height={1700}>
                <div className="bl-noscroll" style={{ height: '100%' }}>
                  <Applications />
                </div>
              </DCArtboard>
            </DCSection>

            {/* ───── WEBSITE DIRECTIONS ───── */}
            <DCSection id="websites" title="Website — Three Directions" subtitle="Three distinct aesthetic approaches. All share the bar.">
              <DCArtboard id="site-a" label="A · Editorial Dark" width={1440} height={3600}>
                <SiteA tweaks={tweaks} />
              </DCArtboard>
              <DCArtboard id="site-b" label="B · Kinetic Yellow" width={1440} height={3400}>
                <SiteB tweaks={tweaks} />
              </DCArtboard>
              <DCArtboard id="site-c" label="C · Architectural Light" width={1440} height={3400}>
                <SiteC tweaks={tweaks} />
              </DCArtboard>
            </DCSection>

          </DesignCanvas>

          {/* TWEAKS PANEL */}
          <TweaksPanel title="Tweaks">
            <TweakSection title="Color">
              <TweakColor label="Primary yellow" value={tweaks.yellow} onChange={v => setTweak('yellow', v)} />
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 6, marginTop: 8 }}>
                {['#fdd535','#FFD60A','#F5C518','#F2C94C'].map(c => (
                  <button key={c} onClick={() => setTweak('yellow', c)}
                    style={{ height: 28, background: c, border: tweaks.yellow === c ? '2px solid #0a0a0a' : '1px solid rgba(0,0,0,0.15)', cursor: 'pointer' }} />
                ))}
              </div>
            </TweakSection>
            <TweakSection title="Theme">
              <TweakRadio value={tweaks.theme} onChange={v => setTweak('theme', v)}
                options={[{value:'dark',label:'Dark'},{value:'light',label:'Light'}]} />
              <div style={{ fontSize: 11, opacity: 0.55, marginTop: 8, lineHeight: 1.4 }}>
                Affects the canvas backdrop. Each website artboard has its own committed theme — open one fullscreen to see it shine.
              </div>
            </TweakSection>
            <TweakSection title="Hero variant">
              <TweakRadio value={tweaks.heroVariant} onChange={v => setTweak('heroVariant', v)}
                options={[{value:'kinetic',label:'Kinetic'},{value:'image',label:'Image'},{value:'minimal',label:'Minimal'}]} />
              <div style={{ fontSize: 11, opacity: 0.55, marginTop: 8, lineHeight: 1.4 }}>
                Direction A respects this setting. Try toggling, then expand the Editorial Dark artboard.
              </div>
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    // Apply theme-driven canvas backdrop
    function applyTheme(theme) {
      document.body.style.background = theme === 'light' ? '#f0eee9' : '#0a0a0a';
    }
    // Watch tweaks (poll a CSS var change is overkill — observe via App effect below)

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
