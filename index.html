<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Lemon — Event Studio · Dubai</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="site.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components/primitives.jsx"></script>
  <script type="text/babel" src="components/chrome.jsx"></script>
  <script type="text/babel" src="components/data.jsx"></script>
  <script type="text/babel" src="pages/home.jsx"></script>
  <script type="text/babel" src="pages/work.jsx"></script>
  <script type="text/babel" src="pages/case-study.jsx"></script>
  <script type="text/babel" src="pages/services.jsx"></script>
  <script type="text/babel" src="pages/studio.jsx"></script>
  <script type="text/babel" src="pages/journal.jsx"></script>
  <script type="text/babel" src="pages/contact.jsx"></script>

  <script type="text/babel">
    function Router() {
      const [route, setRoute] = React.useState(() => (location.hash.replace('#/','') || 'home'));
      React.useEffect(() => {
        const onHash = () => { setRoute(location.hash.replace('#/','') || 'home'); window.scrollTo({top:0,behavior:'instant'}); };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      useSmoothScroll();

      // route can be "home", "work", "work/cs-01", "services", etc.
      const [head, ...rest] = route.split('/');
      let page;
      if (head === 'home' || !head) page = <HomePage />;
      else if (head === 'work' && rest.length === 0) page = <WorkPage />;
      else if (head === 'work') page = <CaseStudyPage slug={rest[0]} />;
      else if (head === 'services') page = <ServicesPage />;
      else if (head === 'studio') page = <StudioPage />;
      else if (head === 'journal') page = <JournalPage />;
      else if (head === 'contact') page = <ContactPage />;
      else page = <HomePage />;

      return (
        <>
          <CursorBar />
          <SiteHeader route={head || 'home'} />
          <main>{page}</main>
          <SiteFooter />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Router />);
  </script>
</body>
</html>
