<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Lemon — Brand & Website (Print)</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    @page { size: A3 portrait; margin: 0; }
    html, body {
      margin: 0; padding: 0; background: #f0eee9;
      font-family: 'Manrope', system-ui, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page {
      width: 297mm;
      page-break-after: always;
      break-after: page;
      break-inside: avoid;
      overflow: hidden;
      position: relative;
      background: #fff;
      display: block;
    }
    .page:last-child { page-break-after: auto; break-after: auto; }
    .page-inner {
      width: 100%;
      transform-origin: top left;
    }
    .cover {
      width: 297mm; height: 420mm;
      background: #0a0a0a; color: #fff;
      padding: 40mm 30mm;
      display: flex; flex-direction: column; justify-content: space-between;
      page-break-after: always;
    }
    .cover h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 96pt; font-weight: 700; letter-spacing: -0.03em; line-height: 0.95;
      margin: 0;
    }
    .cover .meta { font-family: 'JetBrains Mono', monospace; font-size: 10pt; letter-spacing: 0.2em; opacity: 0.6; }
    .toc { padding: 20mm 30mm; background: #fff; color: #0a0a0a; width: 297mm; height: 420mm; page-break-after: always; }
    .toc h2 { font-size: 36pt; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 16mm; }
    .toc ol { list-style: none; padding: 0; margin: 0; }
    .toc li { display: flex; justify-content: space-between; padding: 6mm 0; border-bottom: 1px solid #e0dcd2; font-size: 14pt; }
    .toc li .num { font-family: 'JetBrains Mono', monospace; opacity: 0.4; font-size: 10pt; letter-spacing: 0.2em; min-width: 30mm; }
    .toc li .title { flex: 1; }
    .toc li .pg { font-family: 'JetBrains Mono', monospace; font-size: 10pt; opacity: 0.5; }
    .section-divider {
      width: 297mm; height: 420mm;
      background: #fdd535; color: #0a0a0a;
      padding: 60mm 30mm;
      display: flex; flex-direction: column; justify-content: space-between;
      page-break-after: always;
    }
    .section-divider h2 {
      font-size: 88pt; font-weight: 700; letter-spacing: -0.03em; line-height: 0.95;
      margin: 0;
    }
    .section-divider .num { font-family: 'JetBrains Mono', monospace; font-size: 12pt; letter-spacing: 0.2em; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components/primitives.jsx"></script>
  <script type="text/babel" src="components/brand-guidelines.jsx"></script>
  <script type="text/babel" src="components/site-a.jsx"></script>
  <script type="text/babel" src="components/site-b.jsx"></script>
  <script type="text/babel" src="components/site-c.jsx"></script>

  <script type="text/babel">
    // Page wraps an artboard at natural size and scales it to fit A3 portrait width (297mm at ~96dpi ≈ 1122px).
    // We render artboards at their native pixel size and use CSS transform: scale() to fit the page.
    const A3_W_PX = 1122; // ~297mm
    const A3_H_PX = 1587; // ~420mm

    const Page = ({ width, height, children }) => {
      const scale = A3_W_PX / width;
      return (
        <div className="page" style={{ width: A3_W_PX, height: height * scale }}>
          <div className="page-inner" style={{ width, height, transform: `scale(${scale})` }}>
            {children}
          </div>
        </div>
      );
    };

    function PrintBook() {
      const tweaks = { yellow: '#fdd535', theme: 'dark', heroVariant: 'kinetic' };
      return (
        <>
          {/* COVER */}
          <div className="cover">
            <div className="meta">BL / 2026 EDITION · BRAND DOSSIER</div>
            <div>
              <Wordmark size={300} variant="white" tagline />
            </div>
            <div>
              <h1>Black<br/>Lemon.</h1>
              <div className="meta" style={{ marginTop: '12mm' }}>BRAND GUIDELINES + WEBSITE DIRECTIONS · DXB</div>
            </div>
          </div>

          {/* TOC */}
          <div className="toc">
            <div className="meta" style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: '10pt', letterSpacing: '0.2em', opacity: 0.5, marginBottom: '4mm' }}>CONTENTS</div>
            <h2>Inside.</h2>
            <ol>
              {[
                ['I','Logo System','03'],
                ['II','Color','04'],
                ['III','Typography','05'],
                ['IV','Voice & Tone','06'],
                ['V','Icon Library','07'],
                ['VI','Applications','08'],
                ['VII','Website — Editorial Dark','10'],
                ['VIII','Website — Kinetic Yellow','11'],
                ['IX','Website — Architectural Light','12'],
              ].map(([n,t,p]) => (
                <li key={n}>
                  <span className="num">{n}</span>
                  <span className="title">{t}</span>
                  <span className="pg">PG {p}</span>
                </li>
              ))}
            </ol>
          </div>

          {/* BRAND GUIDELINES SECTIONS */}
          <Page width={1100} height={1280}><LogoSystem /></Page>
          <Page width={1100} height={1280}><ColorSystem /></Page>
          <Page width={1100} height={1280}><TypeSystem /></Page>
          <Page width={1100} height={1100}><VoiceSystem /></Page>
          <Page width={1100} height={1100}><IconSet /></Page>
          <Page width={1100} height={1700}><Applications /></Page>

          {/* WEBSITE DIVIDER */}
          <div className="section-divider">
            <div className="num">PART II / WEBSITE</div>
            <h2>Three<br/>directions.<br/>One bar.</h2>
            <div className="num">A · EDITORIAL DARK   B · KINETIC YELLOW   C · ARCHITECTURAL LIGHT</div>
          </div>

          <Page width={1440} height={3600}><SiteA tweaks={tweaks} /></Page>
          <Page width={1440} height={3400}><SiteB tweaks={tweaks} /></Page>
          <Page width={1440} height={3400}><SiteC tweaks={tweaks} /></Page>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PrintBook />);

    // Auto-print after fonts + JSX + images are ready
    (async () => {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      // Wait for all images
      await Promise.all(Array.from(document.images).map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(res => { img.onload = img.onerror = res; });
      }));
      await new Promise(r => setTimeout(r, 800));
      window.print();
    })();
  </script>
</body>
</html>
